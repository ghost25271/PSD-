<!doctype html>
<html lang="en"><head><meta charset="utf-8"><style>
body{margin:0;width:320px;padding:14px;font:13px system-ui,-apple-system,"Segoe UI",sans-serif;background:#1e2128;color:#fff}
h1{font-size:15px;margin:0 0 6px}
label{display:block;margin:10px 0 3px;opacity:.8}
input,select{width:100%;box-sizing:border-box;background:#2a2e37;color:#fff;border:1px solid #3a3f4b;border-radius:6px;padding:7px 8px;font:inherit}
input[type=checkbox]{-webkit-appearance:none;appearance:none;position:relative;flex:none;box-sizing:border-box;width:40px;height:22px;margin:0;border-radius:999px;cursor:pointer;border:2px solid #ff4d6a;background:rgba(255,60,90,.16);box-shadow:0 0 8px rgba(255,60,90,.6);transition:.2s}input[type=checkbox]::after{content:'';position:absolute;left:3px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:#ff7d92;transition:transform .2s,background .2s}input[type=checkbox]:checked{border-color:#2dff9a;background:rgba(0,255,140,.16);box-shadow:0 0 10px rgba(0,255,140,.7)}input[type=checkbox]:checked::after{transform:translateX(18px);background:#8dffc6}
.c{display:flex;gap:8px;align-items:center;margin:12px 0 0;opacity:1}
button{width:100%;margin-top:14px;padding:9px;border:0;border-radius:8px;background:#3d7be0;color:#fff;font:inherit;cursor:pointer}
button:hover{background:#4f8ced}button:disabled{opacity:.5;cursor:default}
#note{margin-top:8px;font-size:12px;color:#fbbf24;min-height:1.2em}
</style></head><body>
<h1 data-i18n="pp_title"></h1>
<label><span data-i18n="l_etitle"></span> <input id="t" autocomplete="off"></label>
<label><span data-i18n="l_eurl"></span> <input id="u" autocomplete="off"></label>
<label><span data-i18n="pp_where"></span> <select id="d"></select></label>
<label class="c"><input type="checkbox" id="shot" checked> <span data-i18n="pp_shot"></span></label>
<div id="note"></div>
<button id="ok" data-i18n="add_tip"></button>
<script src="i18n.js"></script>
<script src="popup.js"></script>
</body></html>
